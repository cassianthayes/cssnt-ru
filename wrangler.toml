# Configuration for the Cloudflare Pages project (see README.md for setup).
name = "cssnt-ru"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-14"

# Replace database_id with the id printed by `wrangler d1 create cssnt-ru-shoutbox`.
[[d1_databases]]
binding = "DB"
database_name = "cssnt-ru-shoutbox"
database_id = "440c9b08-55dc-4ba1-8b95-11a6125392ae"
migrations_dir = "migrations"
